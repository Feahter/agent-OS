[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-engineering-agent-os"
version = "0.0.1"
description = "Local-first Agent OS for orchestrating Codex, Claude Code, Pi, OpenCode and Orca with verification, cost controls and governed RSI."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Feahter" }]
keywords = [
  "agent-os",
  "graph-engineering",
  "ai-agents",
  "multi-agent",
  "agent-orchestration",
  "llm-orchestration",
  "coding-agents",
  "workflow-engine",
  "local-first",
  "human-in-the-loop",
  "self-improving-agents",
  "cost-optimization",
  "rsi",
  "codex",
  "claude-code",
  "pi-agent",
  "opencode",
  "orca",
  "dag",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Feahter/agent-OS"
Repository = "https://github.com/Feahter/agent-OS"
Issues = "https://github.com/Feahter/agent-OS/issues"

[project.scripts]
agent-os = "grapheng.cli:main"

[tool.setuptools]
packages = ["grapheng"]

[tool.setuptools.package-data]
grapheng = ["compatibility-evidence.json"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "RUF",
]
ignore = [
  "E501",
  "UP006",
  "UP007",
  "UP035",
  "UP045",
  "B008",
  "SIM108",
  "SIM117",
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
files = ["grapheng"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
